<svg width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer triangle: moss green, visible on both light and dark backgrounds -->
  <polygon points="20,2 38,36 2,36" stroke="#4A8A5A" stroke-width="1.5" fill="none" />
  <!-- Middle triangle: semi-transparent white for light-on-dark legibility -->
  <polygon points="20,10 31,32 9,32" stroke="#f3efe7" stroke-width="1" fill="none" opacity="0.45" />
  <!-- Inner triangle: filled moss green -->
  <polygon points="20,18 26,29 14,29" fill="#4A8A5A" opacity="0.9" />
</svg>
